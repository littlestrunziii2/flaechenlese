<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Flächenlese</title>
<meta name="theme-color" content="#0f1512">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flächenlese">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#0f1512;--surface:#0f1512;--sc-low:#171d1a;--sc:#1b211e;--sc-high:#252b28;
  --sv:#404944;--on:#dfe4df;--onsv:#bfc9c2;
  --primary:#8bd5b0;--onprimary:#003825;--pc:#005138;--onpc:#a6f2cb;
  --secondary:#b3ccbe;--onsecondary:#1e352a;--secc:#354b40;--onsecc:#cfe9d9;
  --outline:#89938c;--ov:#404944;--error:#ffb4ab;--icongreen:#003D29;
  --ovbg:#121212;--ovsurf:#1E1E1E;--ovborder:#333333;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--on);font-family:Roboto,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;-webkit-user-select:none;user-select:none}
input,textarea,.selectable{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
a{color:inherit;text-decoration:none}
svg.i{width:24px;height:24px;fill:currentColor;flex:none}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch}
/* Navigation */
nav{display:flex;background:var(--sc);padding:12px 0 calc(12px + var(--safe-b));flex:none}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--onsv);font-size:10px;font-weight:500;min-width:0}
nav .pill{width:56px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;transition:background .2s}
nav button.sel{color:var(--on)}
nav button.sel .pill{background:var(--secc);color:var(--onsecc)}
nav span.l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* Pager */
.pager{position:relative;min-height:100%;touch-action:pan-y;overflow:hidden}
.page{min-height:100%;will-change:transform}
.navarrow{display:none}
@media (hover:hover) and (pointer:fine){
  .navarrow{display:flex;position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:36px;height:36px;border-radius:18px;align-items:center;justify-content:center;background:var(--sc-high);opacity:.55}
  .navarrow:hover{opacity:1}
  .navarrow.l{left:6px}.navarrow.r{right:6px}
}
/* Day */
.grad{background:linear-gradient(to bottom, color-mix(in srgb,var(--primary) 14%,var(--bg)), var(--bg) 100%);min-height:100%}
.daywrap{display:flex;flex-direction:column;align-items:center;gap:24px;padding:calc(32px + var(--safe-t)) 24px 24px}
.chip{display:inline-flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary);border-radius:999px;padding:6px 12px 6px 16px;font-size:11px;font-weight:700;letter-spacing:.5px;margin-bottom:8px}
.chip svg{width:16px;height:16px}
.center{display:flex;flex-direction:column;align-items:center;text-align:center}
.wd{font-size:12px;font-weight:500;color:var(--primary);letter-spacing:2px}
.dt{font-size:24px;font-weight:300;line-height:32px}
.passage{width:100%;padding:16px 0}
.passage .lbl{font-size:16px;font-weight:500;color:var(--onsv);margin:16px 0 12px}
.pass{display:block;font-size:24px;font-weight:700;line-height:38px;padding:4px 16px;border-radius:12px;text-align:center;white-space:pre-line}
.pass:active{background:color-mix(in srgb,var(--on) 8%,transparent)}
.prim{color:var(--primary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--primary);color:var(--onprimary);border-radius:16px;height:48px;padding:0 24px;font-size:14px;font-weight:500;letter-spacing:.1px}
.btn.big{width:80%;height:56px}
.btn.sec{background:var(--secondary);color:var(--onsecondary)}
.btn.tonal{background:var(--secc);color:var(--onsecc)}
.btn.full{width:100%;height:56px;font-weight:700}
.btn svg{width:20px;height:20px}
.btn:disabled{opacity:.38}
.obtn{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:48px;padding:0 24px;border-radius:16px;border:1px solid var(--outline);color:var(--onsv);font-size:14px;font-weight:500}
.obtn.has{background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary)}
.obtn.secc{color:var(--secondary)}
.row{display:flex;align-items:center;gap:8px;width:100%}
.flex1{flex:1;min-width:0}
.flex1 .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.ibtn{width:48px;height:48px;border-radius:24px;display:inline-flex;align-items:center;justify-content:center;color:var(--primary)}
.ibtn.tonalbg{background:var(--secc);color:var(--onsecc);border-radius:16px}
.ibtn.sm{width:40px;height:40px}
.backbtn{position:absolute;top:calc(8px + var(--safe-t));left:8px;z-index:4;width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;color:var(--on)}
/* Calendar */
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;background:var(--surface);padding:var(--safe-t) 16px 0;position:sticky;top:0;z-index:2;border-bottom:1px solid var(--sc-high)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:14px 16px;font-size:14px;font-weight:500;color:var(--onsv);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.sel{color:var(--primary);border-bottom-color:var(--primary)}
.calTitle{text-align:center;font-size:28px;font-weight:700;color:var(--primary);padding:16px 0}
.cal{padding:0 16px 24px}
.wdh{display:grid;grid-template-columns:repeat(7,1fr);padding-bottom:8px}
.wdh div{text-align:center;font-size:11px;font-weight:700;color:color-mix(in srgb,var(--primary) 55%,transparent)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cell{aspect-ratio:1;border-radius:50%;background:var(--sv);color:var(--onsv);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;position:relative}
.cell.read{background:var(--pc);color:var(--onpc);font-weight:700}
.cell.today{background:var(--primary);color:var(--onprimary);font-weight:700;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--primary)}
.cell .nd{display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--secondary);margin-left:2px;vertical-align:middle}
.cell .rd{width:4px;height:4px;border-radius:2px;background:var(--primary)}
.cell.today .rd{background:var(--onprimary)}
.cell.today .nd{background:var(--onprimary)}
/* Overview */
.ov-wrap{background:var(--ovbg);min-height:100%;display:flex;flex-direction:column}
.ovtabs{display:flex;background:var(--ovsurf);padding-top:var(--safe-t);position:sticky;top:0;z-index:2}
.ovtabs button{flex:1;height:48px;color:var(--onsv);font-size:14px;border-bottom:3px solid transparent}
.ovtabs button.sel{color:var(--primary);font-weight:700;border-bottom-color:var(--primary)}
.ovpage{padding:0 8px 20px;background:var(--ovbg)}
.ovhead{display:flex;justify-content:center;align-items:center;gap:12px;padding:8px 0 4px;color:var(--on)}
.tbl{border:1px solid var(--ovborder);border-radius:12px;overflow:hidden;background:var(--ovsurf)}
.tr{display:flex;border-top:.5px solid var(--ovborder)}
.tr:first-child{border-top:0}
.th{font-size:10px;font-weight:700;color:var(--primary);letter-spacing:1px;text-align:center;padding:10px 0}
.tc{padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-left:.5px solid var(--ovborder);min-width:0}
.tc:first-child{border-left:0}
.clamp{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.wvrow{padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;border-top:.5px solid var(--ovborder)}
/* Lists, cards */
.page-pad{padding:calc(16px + var(--safe-t)) 16px 32px}
h1{font-size:28px;font-weight:700;margin:0 0 24px}
.card{background:var(--sc-high);border-radius:12px;padding:16px;margin-bottom:16px}
.card h3{margin:0;font-size:16px;font-weight:700}
.card .sub{font-size:12px;color:var(--onsv);margin-top:2px}
.radio{display:flex;align-items:center;gap:12px;padding:8px 0;width:100%;text-align:left;font-size:16px}
.rdot{width:20px;height:20px;border-radius:10px;border:2px solid var(--onsv);flex:none;position:relative}
.rdot.on{border-color:var(--primary)}
.rdot.on::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--primary)}
.chk{width:18px;height:18px;border-radius:2px;border:2px solid var(--onsv);flex:none;display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--primary);border-color:var(--primary);color:var(--onprimary)}
.chk svg{width:16px;height:16px}
.muted{color:var(--onsv)}
.small{font-size:12px}
.topbar{display:flex;align-items:center;padding:calc(8px + var(--safe-t)) 4px 8px;gap:4px}
.topbar .ttl{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center}
.fld{position:relative;width:100%}
.fld label{position:absolute;left:12px;top:-8px;background:var(--surface);padding:0 4px;font-size:12px;color:var(--onsv)}
.fld input,.fld textarea,.inp{width:100%;background:transparent;border:1px solid var(--outline);border-radius:16px;color:var(--on);font:inherit;font-size:16px;padding:16px;outline:none;resize:vertical}
.fld input:focus,.fld textarea:focus,.inp:focus{border:2px solid var(--primary);padding:15px}
.fld .clr{position:absolute;right:4px;top:6px;display:flex}
.fld .clr button{width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.fld .clr svg{width:18px;height:18px}
.ncard{background:var(--sc-low);border-radius:24px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.ncard .k{font-size:12px;font-weight:500;color:var(--primary);letter-spacing:.5px}
.fchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.fchip{flex:none;height:32px;padding:0 16px;border-radius:8px;border:1px solid var(--outline);font-size:14px;color:var(--onsv);display:flex;align-items:center;gap:6px}
.fchip.sel{background:var(--secc);border-color:transparent;color:var(--onsecc)}
.res{background:var(--sc-low);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.badge{background:var(--pc);color:var(--onpc);border-radius:8px;font-size:11px;padding:2px 8px}
.searchbox{display:flex;align-items:center;border:1px solid var(--outline);border-radius:12px;padding:0 4px 0 12px;gap:8px}
.searchbox input{flex:1;background:none;border:0;color:var(--on);font:inherit;font-size:16px;padding:16px 0;outline:none;min-width:0}
/* Dialog */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.dlg{background:var(--sc-high);border-radius:28px;padding:24px;width:100%;max-width:420px;max-height:86vh;display:flex;flex-direction:column;-webkit-user-select:text;user-select:text}
.dlg .dt2{font-size:24px;line-height:32px;margin-bottom:16px;font-weight:400}
.dlg .body{overflow-y:auto;display:flex;flex-direction:column;gap:16px;color:var(--onsv);font-size:14px;margin:0 -4px;padding:0 4px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:24px;flex-wrap:wrap}
.tbtn{color:var(--primary);font-size:14px;font-weight:500;padding:10px 12px;border-radius:20px}
.fbtn{background:var(--primary);color:var(--onprimary);font-size:14px;font-weight:500;padding:10px 24px;border-radius:20px}
.ocard{border:1px solid var(--ov);border-radius:12px;padding:12px;text-align:left;width:100%;color:var(--on)}
.ocard.sel{background:color-mix(in srgb,var(--primary) 14%,transparent);border-color:var(--primary)}
.popt{display:flex;align-items:center;gap:12px;border:1px solid var(--ov);border-radius:12px;padding:12px;width:100%;text-align:left;color:var(--on);font-size:16px}
.popt.sel{background:var(--pc);border-color:transparent;font-weight:700}
.popt .hs{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:color-mix(in srgb,var(--onsv) 35%,transparent)}
.popt .hs.on{color:var(--primary)}
.popt .hs svg{width:20px;height:20px}
hr{border:0;border-top:1px solid var(--ov);margin:0;width:100%}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + var(--safe-b));background:var(--on);color:var(--bg);padding:14px 16px;border-radius:4px;font-size:14px;max-width:90%;z-index:60;box-shadow:0 3px 8px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.hint{background:var(--secc);color:var(--onsecc);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.45}
#print{display:none}
#ptr{position:fixed;top:var(--safe-t);left:50%;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:var(--sc-high);color:var(--primary);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.45);transform:translateY(-60px);opacity:0;z-index:45;pointer-events:none}
#ptr.back{transition:transform .2s,opacity .2s}
#ptr.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.swrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(128,128,128,.35)}
.dot i{width:12px;height:12px;border-radius:50%;display:block}
.dot.add{background:none;color:var(--onsv);box-shadow:none;border:1.5px dashed var(--outline)}
.dot.sel{box-shadow:0 0 0 2px var(--sc-high),0 0 0 4px var(--primary)}
.crow{display:flex;align-items:center;gap:12px;padding:7px 0;color:var(--on)}
.crow label{flex:1;font-size:15px}
.crow .info{width:22px;height:22px;border-radius:50%;border:1px solid var(--outline);background:none;color:var(--on);font:600 12px/1 inherit;padding:0;cursor:pointer;opacity:.75}
.crow .info.on{background:var(--outline)}
.cinfo{font-size:13px;line-height:1.4;opacity:.8;padding:0 0 8px;color:var(--on)}
.crow input[type=color]{width:52px;height:34px;border:1px solid var(--outline);border-radius:10px;background:none;padding:2px;cursor:pointer}
.crow input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.crow input[type=color]::-webkit-color-swatch{border:none;border-radius:7px}
@media print{
  body{display:block;height:auto;overflow:visible;background:#fff;color:#000}
  body>*:not(#print){display:none!important}
  #print{display:block}
}
.pw{page-break-after:always;font-family:Roboto,Arial,sans-serif;color:#000;padding:8px}
.pw h2{margin:0 0 4px;font-size:22px;display:flex;justify-content:space-between}
.pw h2 span{font-size:14px;color:#777;font-weight:400}
.pw table{width:100%;border-collapse:collapse;font-size:10px}
.pw th{background:#003D29;color:#fff;text-align:left;padding:6px}
.pw td{border:1px solid #ccc;padding:6px;vertical-align:top;white-space:pre-line}
.pw .wv{margin-top:10px;border:1px solid #003D29;border-radius:6px;padding:10px;font-size:11px}
</style>
</head>

<nav id="nav"></nav>
<div id="toast"></div>
<div id="print"></div>

function save(){ scheduleNativeSync(); try{ localStorage.setItem(STORE, JSON.stringify(P)); }catch(e){ if(!save._warned){ save._warned = true; setTimeout(() => toast('⚠️ Speichern fehlgeschlagen – bitte Backup erstellen'), 0); } } }

const getSet = k => new Set(P[k] || []);

/* ================= DATUM ================= */
const D = (y,m,d) => { const t = new Date(y, m-1, d, 12); return {y:t.getFullYear(), m:t.getMonth()+1, d:t.getDate()}; };
const today = () => { const t = new Date(); return D(t.getFullYear(), t.getMonth()+1, t.getDate()); };
const addDays = (a,n) => D(a.y, a.m, a.d+n);
const addMonths = (a,n) => { const t = new Date(a.y, a.m-1+n, 1, 12); const y=t.getFullYear(), m=t.getMonth()+1; return {y, m, d: Math.min(a.d, lenMonth(y,m))}; };
const lenMonth = (y,m) => new Date(y, m, 0).getDate();
const dow = a => { const w = new Date(a.y, a.m-1, a.d, 12).getDay(); return w === 0 ? 7 : w; };
const utc = a => Date.UTC(a.y, a.m-1, a.d);
const fromUtc = ms => { const t = new Date(ms); return {y:t.getUTCFullYear(), m:t.getUTCMonth()+1, d:t.getUTCDate()}; };
const daysBetween = (a,b) => Math.round((utc(b) - utc(a)) / 864e5);
const sameDay = (a,b) => a.y===b.y && a.m===b.m && a.d===b.d;
function isoWeek(a){ const t = new Date(Date.UTC(a.y, a.m-1, a.d)); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t - y0)/864e5 + 1)/7); }
const mondayOf = a => addDays(a, 1 - dow(a));
const WD  = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];

/* ================= LESEPLAN-LOGIK ================= */
const planType = () => P.plan_type || 'LARGE';
function prefix(t){ if(t==='LARGE') return 'L'; if(t==='SMALL') return 'S'; if(t==='CUSTOM') return 'C'; if(t.startsWith('CUSTOM_')) return 'C_'+t.slice(7); return 'L'; }
function readKey(t){ if(t==='SMALL') return 'small_read_days'; if(t==='CUSTOM') return 'custom_read_days'; if(t.startsWith('CUSTOM_')) return 'custom_read_'+t.slice(7); return 'read_days'; }
const customIds = () => P.custom_plan_ids || [];
const customName = id => P['custom_name_'+id] || 'Unbenannter Plan';
function planLabel(t){
  if(t==='LARGE') return 'Große Flächenlese';
  if(t==='SMALL') return 'Kleine Flächenlese';
  if(t==='CUSTOM') return 'Eigener Leseplan';
  if(t.startsWith('CUSTOM_')) return customName(t.slice(7));
  return 'Flächenlese';
}
function planName(t){
  if(t==='LARGE') return 'GROSSE FLÄCHENLESE';
  if(t==='SMALL') return 'KLEINE FLÄCHENLESE';
  if(t==='CUSTOM') return 'EIGENER LESEPLAN';
  if(t.startsWith('CUSTOM_')) return customName(t.slice(7)).toUpperCase();
  return 'FLÄCHENLESE';
}
function isRead(a, t=planType()){
  const s = getSet(readKey(t));
  return s.has(iso(a)) || (a.y===2026 && s.has(pad(a.m)+'-'+pad(a.d)));
}
function toggleRead(a, t=planType()){
  const k = readKey(t), s = getSet(k), v = iso(a), old = pad(a.m)+'-'+pad(a.d);
  if(s.has(v)) s.delete(v);
  else if(a.y===2026 && s.has(old)) s.delete(old);
  else s.add(v);
  putSet(k, s); save();
}
function customPassage(csv, start, target, rep){
  const lines = csv.split(/\r\n|\r|\n/).filter(l => l.trim());
  if(!lines.length) return null;
  const db = daysBetween(start, target);
  if(db < 0) return null;
  let i;
  if(rep) i = db % lines.length; else { if(db >= lines.length) return null; i = db; }
  return lines[i].split(/[,;\t]/).filter(x => x.trim()).join('|');
}
function planPassage(a, t=planType()){
  if(t.startsWith('CUSTOM')){
    const id = t.slice(7);
    const csv = t==='CUSTOM' ? P.custom_plan_data : P['custom_data_'+id];
    const st  = t==='CUSTOM' ? P.custom_plan_start_date : P['custom_start_'+id];
    const rep = t.startsWith('CUSTOM_') ? !!P['custom_repeat_'+id] : false;
    if(csv != null && st != null) return customPassage(csv, fromUtc(st), a, rep) ?? 'Plan beendet';
    return 'Kein Plan geladen';
  }
  const arr = PLANS[t==='SMALL' ? 'S' : 'L'][a.m];
  return (arr && arr[a.d-1]) || 'Kein Eintrag';
}
function effPassage(a){
  const p = planPassage(a);
  if(!['Plan beendet','Kein Eintrag','Kein Plan geladen'].includes(p)) return p;
  const r = getN('r', a);
  return r.trim() ? r : p;
}
function splitPassages(passage){
  const raw = String(passage).split(/[|\n\/]+/).map(s => s.trim()).filter(Boolean);
  const out = []; let lastBook = '';
  for(const part of raw){
    const letters = (part.match(/\p{L}/gu) || []).length;
    if(letters > 3){
      const m = part.match(/^(.+?)\s+\d[\d,:.\-–\s]*$/);
      if(m) lastBook = m[1];
      out.push(part);

const nKey = (k,t,a) => `${k}_${prefix(t)}_${a.y}_${a.m}_${a.d}`;
function getN(k, a, t=planType()){ return P[nKey(k,t,a)] ?? (t==='LARGE' ? P[`${k}_${a.y}_${a.m}_${a.d}`] : null) ?? ''; }
function getMon(k, y, m, t=planType()){ return P[`${k}_${prefix(t)}_${y}_${m}`] ?? (t==='LARGE' ? P[`${k}_${y}_${m}`] : null) ?? ''; }
function getYear(k, y, t=planType()){ return P[`${k}_${prefix(t)}_${y}`] ?? (t==='LARGE' ? P[`${k}_${y}`] : null) ?? ''; }

function saveWeekly(a, r, v, src){ const t = planType(); P[nKey('wr',t,a)] = r; P[nKey('wv',t,a)] = v; P[nKey('ws',t,a)] = src; save(); }
function saveMonthly(y, m, r, v){ const p = prefix(planType()); P[`mr_${p}_${y}_${m}`] = r; P[`mv_${p}_${y}_${m}`] = v; save(); }
function saveYearly(y, r, v){ const p = prefix(planType()); P[`yr_${p}_${y}`] = r; P[`yv_${p}_${y}`] = v; save(); }
function weeklyNote(a){
  const sd = getN('ws', a);
  if(sd){ const p = sd.split('_'); if(p.length >= 2){
    const m = +p[p.length-2] || a.m, d = +p[p.length-1] || a.d, y = p.length >= 3 ? (+p[p.length-3] || a.y) : a.y;
    return getN('n', D(y,m,d));
  }}
  return getN('wn', a);
}
function daysWithNotes(t=planType()){
  const pre = prefix(t), out = new Set();
  for(const [k,v] of Object.entries(P)){
    if(typeof v !== 'string' || !v.trim()) continue;
    const own = k.startsWith(`v_${pre}_`) || k.startsWith(`n_${pre}_`) || k.startsWith(`r_${pre}_`);
    const legacy = t==='LARGE' && !k.includes('_L_') && !k.includes('_S_') && !k.includes('_C_') && /^(v|n|r)_\d/.test(k);

}

function bibleUrl(passage){
  const p = String(passage).trim(), low = p.toLowerCase();
  let code = null, found = null, foundIdx = Infinity;
  for(const b of BOOK_NAMES){ const i = low.indexOf(b.toLowerCase()); if(i !== -1 && i < foundIdx){ code = BOOKS[b]; found = b; foundIdx = i; } }

  const parts = rest.split(/[\s,:]+/).filter(Boolean);
  const chapter = (parts[0] || '1').split(/[-–]/)[0];
  const verse = parts[1] ? parts[1].split(/[-–]/)[0] : null;
  const ref = verse && /^\d+$/.test(verse) ? `${code}.${chapter}.${verse}` : `${code}.${chapter}`;

}

function dialog(title, bodyHtml, actions, opts={}){

  ov.innerHTML = `<div class="dlg">${title ? `<div class="dt2">${title}</div>` : ''}<div class="body">${bodyHtml}</div><div class="acts"></div></div>`;

function utf8b64(str){ const bytes = new TextEncoder().encode(str); let bin = ''; for(let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000)); return btoa(bin); }
async function saveFile(filename, data, mime, preferShare=false){
  if(NATIVE){ try{ return !!window.FLApp.saveFile(filename, mime, utf8b64(String(data))); }catch(e){ toast('Speichern nicht möglich'); return false; } }
  if(preferShare && !(window.claude && window.claude.use) && navigator.canShare){
    try{
      const file = new File([data], filename, {type: mime});
      if(navigator.canShare({files:[file]})){ await navigator.share({files:[file], title: filename}); return true; }
    }catch(e){ if(e && e.name === 'AbortError') return false; }
  }
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      const dl = await window.claude.use('downloads');
      if(dl){ await dl.save({filename, data}); return true; }
    }
  }catch(e){ if(e && e.code === 'declined') return false; }
  try{
    const blob = new Blob([data], {type: mime});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    return true;
  }catch(e){ toast('Speichern nicht möglich'); return false; }
}

let tab = 'home';
let stack = [];
const S = { homeOff:0, calOff:0, ovTab:0, ovOff:[0,0,0], search:'', searchPlan:'ALL' };
let pendingSlide = 0;
const TABS = [['home','home','Heute'],['calendar','cal','Kalender'],['overview','table','Ansicht'],['search','search','Suchen'],['settings','settings','Einstellungen']];
let lastNavTap = {};
function renderNav(){
  $('#nav').innerHTML = TABS.map(([id,icn,lbl]) => `<button data-a="tab" data-tab="${id}" class="${tab===id?'sel':''}"><span class="pill">${ic(icn)}</span><span class="l">${lbl}</span></button>`).join('');
}
function current(){ return stack.length ? stack[stack.length-1] : {name: tab}; }
let awaitingPop = 0;
function push(route){ stack.push(route); try{ history.pushState({fl: stack.length}, ''); }catch(e){} render(); }
function goBack(){
  if(!stack.length) return;
  let handled = false; awaitingPop++;
  const fallback = setTimeout(() => { if(!handled){ awaitingPop = Math.max(0, awaitingPop-1); stack.pop(); render(); } }, 350);
  try{ history.back(); }catch(e){}
  goBack._h = () => { handled = true; clearTimeout(fallback); };
}
window.addEventListener('popstate', () => {
  if(goBack._h){ goBack._h(); goBack._h = null; awaitingPop = Math.max(0, awaitingPop-1); }
  if(stack.length){ stack.pop(); render(); }
});

function render(keepScroll=false){
  const scr = $('#screen'); const r = current();
  const key = r.name + (r.date ? iso(r.date) : '');
  const st = keepScroll && render._last === key ? scr.scrollTop : 0;
  scr.innerHTML = SCREENS[r.name](r);
  render._last = key;
  scr.scrollTop = st;
  renderNav();
  AFTER[r.name] && AFTER[r.name](r);
  const pg = scr.querySelector('.page');
  if(pg && pendingSlide){
    const dir = pendingSlide; pendingSlide = 0;
    pg.style.transition = 'none'; pg.style.transform = `translateX(${dir*40}%)`; pg.style.opacity = '.3';
    requestAnimationFrame(() => requestAnimationFrame(() => { pg.style.transition = 'transform .22s ease-out, opacity .22s'; pg.style.transform = 'translateX(0)'; pg.style.opacity = '1'; }));
  }
}

/* ===== Wischen (wie HorizontalPager) ===== */
let suppressClick = false;
function attachSwipe(el, step){
  const page = el.querySelector('.page'); if(!page) return;
  let sx=0, sy=0, dx=0, active=false, lock=null;
  el.addEventListener('pointerdown', e => { if(e.pointerType==='mouse' && e.button!==0) return; if(e.target.closest('input,textarea')) return; sx=e.clientX; sy=e.clientY; dx=0; active=true; lock=null; });
  el.addEventListener('pointermove', e => {
    if(!active) return;
    const mx = e.clientX - sx, my = e.clientY - sy;
    if(lock === null && (Math.abs(mx) > 10 || Math.abs(my) > 10)){ lock = Math.abs(mx) > Math.abs(my) ? 'x' : 'y'; if(lock==='x'){ try{ el.setPointerCapture(e.pointerId); }catch(_){} } }
    if(lock === 'x'){ dx = mx; page.style.transition = 'none'; page.style.transform = `translateX(${dx}px)`; }
  });
  const end = () => {
    if(!active) return; active = false;
    if(lock !== 'x') return;
    suppressClick = true; setTimeout(() => suppressClick = false, 60);
    const w = el.clientWidth;
    if(Math.abs(dx) > Math.min(70, w*0.18)){
      const dir = dx < 0 ? 1 : -1;
      page.style.transition = 'transform .16s ease-in'; page.style.transform = `translateX(${-dir*w}px)`;
      setTimeout(() => { pendingSlide = dir; step(dir); }, 150);
    } else { page.style.transition = 'transform .2s'; page.style.transform = 'translateX(0)'; }
  };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}
document.addEventListener('click', e => { if(suppressClick){ e.preventDefault(); e.stopPropagation(); } }, true);
let pagerStep = null;
document.addEventListener('keydown', e => {
  if(document.querySelector('.ovl') || e.target.closest('input,textarea')) return;
  if(pagerStep && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')){ const d = e.key === 'ArrowRight' ? 1 : -1; pendingSlide = d; pagerStep(d); }
});
const arrows = () => `<button class="navarrow l" data-a="pg" data-d="-1">${ic('back',20)}</button><button class="navarrow r" data-a="pg" data-d="1">${ic('fwd',20)}</button>`;

/* Tippen vs. Doppeltippen */
let lastTap = {k:null, t:0, timer:null};
function tapOrDouble(key, single, dbl){
  const now = Date.now();
  if(lastTap.k === key && now - lastTap.t < 320){ clearTimeout(lastTap.timer); lastTap = {k:null,t:0,timer:null}; dbl(); }
  else { clearTimeout(lastTap.timer); lastTap = {k:key, t:now, timer:setTimeout(() => { lastTap.k = null; single(); }, 260)}; }
}

/* ----- Suche ----- */
function searchNotes(planId, query){
  if(!query.trim()) return [];
  const ql = query.trim().toLocaleLowerCase('de'), toks = ql.split(/\s+/).filter(Boolean);
  const pre = planId !== 'ALL' ? prefix(planId) : '';
  const entries = new Map(); const re = /_(\d{4})_(\d{1,2})_(\d{1,2})$/;
  for(const [k,v] of Object.entries(P)){
    if(typeof v !== 'string' || !v.trim()) continue;
    if(planId !== 'ALL' && !(k.includes(`_${pre}_`) || (planId==='LARGE' && !k.includes('_L_') && !k.includes('_S_') && !k.includes('_C_')))) continue;
    const m = k.match(re); if(!m) continue;
    const id = `${m[1]}_${+m[2]}_${+m[3]}`; if(!entries.has(id)) entries.set(id, {y:+m[1], m:+m[2], d:+m[3], e:{}});
    entries.get(id).e[k] = v.trim();
  }
  const match = t => { if(!t || !t.trim()) return false; const l = t.toLocaleLowerCase('de'); return l.includes(ql) || toks.every(x => l.includes(x)); };
  const out = [];
  for(const {y,m,d,e} of entries.values()){
    const f = p => { const k = Object.keys(e).find(k => k.startsWith(p)); return k ? e[k] : ''; };
    const note = f('n_'), wnote = f('wn_'), ref = f('r_'), wref = f('wr_'), verse = f('v_'), wverse = f('wv_');
    const ds = `${pad(d)}.${pad(m)}.${y}`;
    if(match(note)) out.push({y,m,d,cat:'Tagesnotiz', ref: ref || `Notiz vom ${ds}`, content: note, ds});
    if(match(wnote)) out.push({y,m,d,cat:'Wochennotiz', ref: wref || `Wochennotiz ${ds}`, content: wnote, ds});
    if(match(ref) || match(verse)) out.push({y,m,d,cat:'Bibelstelle / Vers', ref: ref || `Eintrag ${ds}`, content: verse || ref, ds});
    if(match(wref) || match(wverse)) out.push({y,m,d,cat:'Wochenvers', ref: wref || `Wochenvers ${ds}`, content: wverse || wref, ds});
  }
  return out.sort((a,b) => b.y-a.y || b.m-a.m || b.d-a.d);
}
function renderResults(){
  const box = $('#sres'); if(!box) return;
  if(!S.search.trim()){ box.innerHTML = `<div class="center" style="padding:64px 0;gap:8px">${ic('search',48,'muted')}<div style="font-size:16px" class="muted">Geben Sie einen Suchbegriff ein</div><div class="muted" style="opacity:.7;font-size:14px">Durchsuchen Sie Notizen, Verse und Bibelstellen</div></div>`; return; }

function runAutofill(input, o){
  const lines = input.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const names = Object.keys(BOOKS).sort((a,b) => b.length - a.length);
  const isRef = l => names.some(n => l.toLowerCase().startsWith(n.toLowerCase()));
  const blocks = []; let cur = [];
  for(const l of lines){ const link = l.startsWith('http'); if(!link && isRef(l) && cur.length){ blocks.push(cur); cur = []; } cur.push(l); }
  if(cur.length) blocks.push(cur);
  const refs = [], verses = [];
  for(const b of blocks){
    let ref = '', vl = [];
    if(isRef(b[0])){ ref = b[0]; b.slice(1).forEach(x => { if(!x.startsWith('http')) vl.push(x); }); }
    else { const i = b.findIndex(isRef); if(i !== -1){ ref = b[i]; b.forEach((x,j) => { if(j !== i && !x.startsWith('http')) vl.push(x); }); } else b.forEach(x => { if(!x.startsWith('http')) vl.push(x); }); }
    let pr = ref.trim();
    if(pr){ if(o.tr){ const p = pr.split(' '); if(p.length > 2) pr = p.slice(0,-1).join(' '); } if(o.colon) pr = pr.replace(/:/g, ','); refs.push(pr); }
    let v = vl.join(' ').trim();
    if(o.num) v = v.replace(/^\s*[„"'“«»‹›]*\s*\[\d+\]\s*/, '').trim();
    if(o.quotes){ const q = `"'„“”‘’«»‹›`; while(v && q.includes(v[0])) v = v.slice(1).trim(); while(v && q.includes(v[v.length-1])) v = v.slice(0,-1).trim(); }
    if(v) verses.push(v);
  }
  let combined = ''; const n = Math.max(refs.length, verses.length);
  for(let i=0;i<n;i++){ if(i<refs.length) combined += refs[i] + '\n'; if(i<verses.length) combined += o.quotes ? verses[i] : `'${verses[i]}'`; if(i<n-1) combined += '\n\n'; }
  return {refs: refs.join('\n'), verses: verses.join('\n\n'), combined};
}

function parseCsv(text){
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const firstLine = text.split(/\r?\n/)[0];
  const delim = firstLine.includes(';') ? ';' : firstLine.includes('\t') ? '\t' : ',';
  const rows = []; let row = [], f = '', q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === delim){ row.push(f); f = ''; }
    else if(c === '\n' || c === '\r'){ if(c === '\r' && text[i+1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if(f !== '' || row.length){ row.push(f); rows.push(row); }
  const cols = (rows.shift() || []).map(c => c.trim().replace(/^"|"$/g, '').toLowerCase());
  return rows.filter(r => r.some(x => x.trim())).map(r => { const o = {}; cols.forEach((c,i) => { if(i < r.length) o[c] = r[i]; }); return o; });
}
function parseFlexDate(raw){
  raw = raw.trim(); let m;
  const ok = (y,mo,d) => { if(mo<1||mo>12||d<1||d>31) return null; const t = new Date(y, mo-1, d, 12); return t.getMonth() === mo-1 ? {y,m:mo,d} : null; };
  if((m = raw.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/))) return ok(+m[1], +m[2], +m[3]);
  if((m = raw.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/))){ let y = +m[3]; if(y < 100) y += 2000; return ok(y, +m[2], +m[1]); }
  if((m = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/))){ let y = +m[3]; if(y < 100) y += 2000; return ok(y, +m[1], +m[2]); }
  return null;
}
function normalizePlan(p){
  const u = p.toUpperCase().trim();
  if(p.trim().toUpperCase().startsWith('CUSTOM_')) return 'CUSTOM_' + p.trim().slice(7);
  if(u==='LARGE'||u==='L'||u.includes('GROSS')||u.includes('GROß')||u.includes('LARGE')) return 'LARGE';
  if(u==='SMALL'||u==='S'||u.includes('KLEIN')||u.includes('SMALL')) return 'SMALL';
  if(u==='CUSTOM'||u==='C'||u.includes('EIGEN')) return 'CUSTOM';
  return 'LARGE';
}

function buildPrint(year){

  let mon = mondayOf({y:year, m:1, d:1});
  while(true){
    const days = [...Array(7)].map((_,i) => addDays(mon, i)); const sun = days[6];
    if(mon.y > year) break;
    const has = days.some(a => isRead(a) || getN('r',a) || getN('v',a) || getN('n',a)) || getN('wr', sun) || getN('wv', sun);
    if(has && (days.some(a => a.y === year))){
      const rows = days.map(a => `<tr><td><b style="color:#777;font-size:8px">${WD[dow(a)-1].toUpperCase()}</b><br><b style="color:#003D29">${pad(a.d)}.${pad(a.m)}.</b>${isRead(a) ? ' ✓' : ''}</td><td><b>${esc(splitPassages(effPassage(a)).join('\n'))}</b></td><td>${getN('r',a) ? `<b>${esc(getN('r',a))}</b>\n` : ''}${esc(getN('v',a))}</td><td>${esc(getN('n',a))}</td></tr>`).join('');
      const wr = getN('wr', sun), wv = getN('wv', sun), wn = weeklyNote(sun);
      pages += `<div class="pw"><h2>KW ${isoWeek(mon)} <span>${MN[sun.m-1]} ${sun.y}</span></h2><table><tr><th style="width:12%">TAG</th><th style="width:22%">STELLE</th><th style="width:33%">VERS</th><th>NOTIZ</th></tr>${rows}</table>

    }
    mon = addDays(mon, 7);

  return pages || '<div class="pw">Keine Einträge für dieses Jahr gefunden.</div>';
}

  install(){ if(deferredInstall){ deferredInstall.prompt(); deferredInstall.userChoice.finally(() => { deferredInstall = null; render(true); }); } },

  reset(){ confirmDialog('Alle Daten löschen?', 'Lesefortschritt, Notizen, Verse und eigene Pläne auf diesem Gerät werden gelöscht. Das kann nicht rückgängig gemacht werden.', 'Löschen', () => { P = {}; save(); S.homeOff = 0; render(); toast('Alle Daten gelöscht'); }); }

/* Übertragung Browser -> Android-App */
const b64url = bytes => { let bin = ''; for(let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000)); return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const fromB64url = str => { str = str.replace(/-/g,'+').replace(/_/g,'/'); while(str.length % 4) str += '='; const bin = atob(str); const u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return u; };
async function packData(){
  const data = {...P}; delete data.install_hint_dismissed; delete data.backup_prompt_day;
  const stream = new Blob([JSON.stringify({flaechenlese:1, data})]).stream().pipeThrough(new CompressionStream('deflate'));
  return b64url(new Uint8Array(await new Response(stream).arrayBuffer()));
}
async function unpackData(str){
  const stream = new Blob([fromB64url(str)]).stream().pipeThrough(new DecompressionStream('deflate'));
  const obj = JSON.parse(await new Response(stream).text());
  if(!obj || obj.flaechenlese !== 1 || typeof obj.data !== 'object') throw new Error('format');
  return obj.data;
}
async function transferToApp(){
  try{
    const d = await packData();
    location.href = `intent://import?d=${d}#Intent;scheme=flaechenlese;package=de.flaechenlese.app;end`;
  }catch(e){ toast('Übertragung nicht möglich – bitte Backup-Datei nutzen'); }
}
window.flImport = async str => {
  let data; try{ data = await unpackData(str); }catch(e){ toast('❌ Daten konnten nicht gelesen werden'); return; }
  const count = Object.keys(data).filter(k => /^(r|v|n)_/.test(k)).length + (data.read_days||[]).length + (data.small_read_days||[]).length;
  dialog('Daten übernehmen?', `<div>Die Daten aus dem Browser werden in die App übernommen (${count} Einträge). Die bisherigen Daten in der App werden dabei ersetzt.</div>`,
    [{label:'Abbrechen'},{label:'Übernehmen', filled:true, onClick: () => { P = {...data, install_hint_dismissed:true}; save(); applyTheme(); stack = []; tab = 'home'; render(); nativeSync(); toast('✅ Daten übernommen'); }}]);
};

/* Datenaustausch mit der Android-App (Widget + Benachrichtigungen) */
let nativeTimer = null;
function scheduleNativeSync(){ if(!NATIVE) return; clearTimeout(nativeTimer); nativeTimer = setTimeout(nativeSync, 300); }
function nativeSync(){
  if(!NATIVE) return;
  try{
    const t0 = today(), plans = {};
    for(const id of allPlanIds()){
      const days = {};
      for(let i=-2; i<=60; i++){ const a = addDays(t0, i); let p = planPassage(a, id); if(['Plan beendet','Kein Eintrag','Kein Plan geladen'].includes(p)){ const r = getN('r', a, id); if(r.trim()) p = r; } const parts = splitPassages(p); days[iso(a)] = {p: parts.join('\n'), r: isRead(a, id), u: (parts.length ? bibleUrl(parts[0]) : null) || ''}; }
      const reads = [...getSet(readKey(id))].map(x => x.length === 5 ? '2026-' + x : x).filter(x => /^\d{4}-\d{2}-\d{2}$/.test(x));
      plans[id] = {name: planLabel(id), days, reads};
    }
    const tc = themeColors();
    const colors = {bg: tc.surface, text: tc.text, muted: mixC(tc.text, tc.surface, .4), btn: mixC(tc.surface, tc.text, .14), read: tc.read, onRead: bestOn(tc.read, [tc.accent, tc.text, tc.onAccent]), accent: tc.accent, onAccent: tc.onAccent};
    window.FLApp.sync(JSON.stringify({v:1, colors, active: planType(), activeName: planName(planType()), notif:{enabled: !!(P.morning_enabled || P.evening_enabled), mh: P.morning_hour ?? 8, mm: P.morning_minute ?? 0, eh: P.evening_hour ?? 20, em: P.evening_minute ?? 0, plans: notifPlans()}, plans}));
  }catch(e){}
}
function applyNativeToggles(){
  if(!NATIVE) return false;
  try{
    const list = JSON.parse(window.FLApp.takePendingToggles() || '[]');
    for(const x of list){ const a = parseIso(x.date); const k = readKey(x.plan), s2 = getSet(k), v = iso(a); if(x.read) s2.add(v); else s2.delete(v); putSet(k, s2); }
    if(list.length){ save(); return true; }
  }catch(e){}
  return false;
}
window.flOpenDay = d => { try{ document.querySelectorAll('.ovl').forEach(o => o.remove()); tab = 'calendar'; stack = []; push({name:'day', date: clampDate(parseIso(d)), off:0}); }catch(e){} };

/* ================= KALENDER-ERINNERUNG (.ics) ================= */
function makeIcs(){
  const v = ($('#remTime') && $('#remTime').value) || '08:00'; const [h, m] = v.split(':').map(Number);
  P.morning_hour = h; P.morning_minute = m; save();
  const t = today(); const now = new Date();
  const stamp = `${now.getUTCFullYear()}${pad(now.getUTCMonth()+1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}00Z`;
  const ds = `${t.y}${pad(t.m)}${pad(t.d)}T${pad(h)}${pad(m)}00`;
  const end = new Date(2000,0,1,h,m+15); const de = `${t.y}${pad(t.m)}${pad(t.d)}T${pad(end.getHours())}${pad(end.getMinutes())}00`;
  const url = location.href.split('#')[0];
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Flaechenlese//Web//DE','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    `UID:flaechenlese-reminder-${Date.now()}@flaechenlese`, `DTSTAMP:${stamp}`, `DTSTART:${ds}`, `DTEND:${de}`, 'RRULE:FREQ=DAILY',
    'SUMMARY:📖 Flächenlese – Bibel lesen', `DESCRIPTION:Zeit für deinen heutigen Leseabschnitt.\\n${url}`, `URL:${url}`,
    'BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:PT0M','DESCRIPTION:Flächenlese – Bibel lesen','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  saveFile('Flaechenlese-Erinnerung.ics', ics, 'text/calendar').then(ok => ok && toast('Datei öffnen, um die Erinnerung zum Kalender hinzuzufügen'));
}

/* ================= ZUM AKTUALISIEREN HERUNTERZIEHEN ================= */
function setupPullToRefresh(){
  const scr = $('#screen'), ind = document.createElement('div'); ind.id = 'ptr'; ind.innerHTML = ic('refresh', 22); document.body.appendChild(ind);
  const svg = ind.querySelector('svg'), TH = 70;
  let sy = 0, sx = 0, dy = 0, active = false, busy = false;
  const blocked = () => { const r = current(); return busy || document.querySelector('.ovl') || (r.name === 'note' && r.edit) || (document.activeElement && document.activeElement.matches('input,textarea')); };
  const hide = () => { ind.classList.add('back'); ind.style.transform = 'translateY(-60px)'; ind.style.opacity = '0'; dy = 0; };
  scr.addEventListener('touchstart', e => {
    active = e.touches.length === 1 && scr.scrollTop <= 0 && !blocked();
    if(active){ sy = e.touches[0].clientY; sx = e.touches[0].clientX; dy = 0; ind.classList.remove('back'); }
  }, {passive:true});
  scr.addEventListener('touchmove', e => {
    if(!active) return;
    const y = e.touches[0].clientY - sy, x = Math.abs(e.touches[0].clientX - sx);
    if(dy === 0 && (x > Math.abs(y) || y <= 0)){ active = false; return; }
    if(scr.scrollTop > 0){ active = false; hide(); return; }
    dy = Math.min(Math.max(y, 0) * 0.5, 120);
    if(dy > 2 && e.cancelable) e.preventDefault();
    ind.style.transform = `translateY(${dy - 44}px)`; ind.style.opacity = String(Math.min(1, dy / TH));
    svg.style.transform = `rotate(${dy * 4}deg)`; ind.style.color = dy >= TH ? 'var(--primary)' : 'var(--onsv)';
  }, {passive:false});
  const end = async () => {
    if(!active) return; active = false;
    if(dy >= TH){
      busy = true; ind.classList.add('back', 'spin'); ind.style.transform = `translateY(${TH - 44}px)`; svg.style.transform = '';
      try{ const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if(reg) await Promise.race([reg.update(), new Promise(r => setTimeout(r, 2500))]); }catch(err){}
      setTimeout(() => location.reload(), 250);
    } else hide();
  };
  scr.addEventListener('touchend', end); scr.addEventListener('touchcancel', () => { active = false; hide(); });
}

    [{label:'Später'},{label:'Jetzt sichern', filled:true, onClick: () => exportCsv()}]);
}, 1500);
